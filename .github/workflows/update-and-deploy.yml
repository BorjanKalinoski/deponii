name: Update data

# GitHub Pages publishes the site straight from the main branch
# (Settings → Pages → Deploy from a branch: main, / (root)).
# This workflow only runs the tests and refreshes the checked data copy;
# a data commit it pushes to main is what updates the live site.

on:
  schedule:
    # Once a day, 04:17 UTC (05:17 / 06:17 in Skopje).
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        run: node --test

      - name: Fetch and check the Map data feed
        if: github.event_name != 'push'
        run: node scripts/update-data.mjs

      - name: Save the checked data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/map-data.csv data/meta.json
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Data check $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
