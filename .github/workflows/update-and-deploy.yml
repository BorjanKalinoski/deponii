name: Update data and deploy

on:
  schedule:
    # Once a day, 04:17 UTC (05:17 / 06:17 in Skopje).
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        run: node --test

      - name: Fetch and check the Map data feed
        if: github.event_name != 'push'
        run: node scripts/update-data.mjs

      - name: Save the checked data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/map-data.csv data/meta.json
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Data check $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
