name: CI

# Unit tests, the vendored-files check, the end-to-end suite (desktop + phone)
# and an audit of the production dependencies. The daily maintenance routine
# (docs/maintenance.md) checks this workflow's run for every commit it releases.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded branch and pull request runs are cancelled; runs for main queue
  # instead, so a released commit's run is never cancelled part-way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: node --test

      - name: Vendored files match the installed packages
        run: node scripts/vendor.mjs --check

      # --no: use the project's @playwright/test, never download another version.
      - name: Install the Playwright browser
        run: npx --no playwright install --with-deps chromium

      - name: End-to-end tests (desktop + phone)
        run: npx --no playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  audit:
    # A separate job, so a new advisory shows up on its own and never hides
    # whether the tests passed.
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail on high or critical advisories in production dependencies
        run: npm audit --audit-level=high --omit=dev
